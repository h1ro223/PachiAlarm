# XcodeGen 設定(GitHub Actions上で .xcodeproj を自動生成する)
# Macが無いので .xcodeproj はリポジトリに入れない
name: PachiAlarm
options:
  bundleIdPrefix: com.h1ro223
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  PachiAlarm:
    type: application
    platform: iOS
    sources:
      - path: ios/PachiAlarm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.h1ro223.pachialarm
        PRODUCT_NAME: PachiAlarm
        INFOPLIST_FILE: ios/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        # 署名はWindows側のSideloadlyで行うので、CIでは署名しない
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
    scheme: {}
